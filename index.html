    b.textContent = t.label;
    b.addEventListener('click', () => {
      activeTab = i;
      buildTypeTabs();
      buildTypeList();
    });
    bar.appendChild(b);
  });
}

function buildTypeList() {
  const ul = document.getElementById('type-list');
  ul.innerHTML = '';
  const tab = TYPE_TABS[activeTab];
  const groups = TYPE_GROUPS.filter(g => tab.groups.includes(g.label));
  groups.forEach(group => {
    if (groups.length > 1) {                       // 單一群組的分頁不顯示小標
      const hdr = document.createElement('li');
      hdr.className = 'type-group-lbl';
      hdr.textContent = group.label;
      ul.appendChild(hdr);
    }
    group.keys.forEach(key => {
      const label = TYPE_MAP[key] || key;
      const li = document.createElement('li');
      li.textContent = label; li.dataset.key = key;
      if (key === currentType) li.classList.add('sel');
      li.addEventListener('click', () => selectType(key));
      ul.appendChild(li);
    });
  });
}

// ============================================================
// UI Build
// ============================================================
function buildUI() {
  // Type tabs + list
  buildTypeTabs();
  buildTypeList();

  // Size radios
  const sr = document.getElementById('size-row');
  ['64','128','256','512','1024'].forEach(s => {
    const lbl = document.createElement('label');
    const r = document.createElement('input');
    r.type='radio'; r.name='size'; r.value=s;
    if (s==='512') r.checked=true;
    r.addEventListener('change', schedulePreview);
    lbl.appendChild(r); lbl.append(' '+s);
    sr.appendChild(lbl);
  });

  // Colormap radios
  const cr = document.getElementById('cmap-row');
  [['gray','灰階'],['gold','金色'],['plasma','Plasma']].forEach(([v, l]) => {
    const lbl = document.createElement('label');
    const r = document.createElement('input');
    r.type='radio'; r.name='cmap'; r.value=v;
    if (v==='gray') r.checked=true;
    r.addEventListener('change', schedulePreview);
    lbl.appendChild(r); lbl.append(' '+l);
    cr.appendChild(lbl);
  });

  // Tile buttons
  const tb = document.getElementById('tile-btns');
  [1,2,4].forEach(t => {
    const btn = document.createElement('button');
    btn.className = 'tile-btn' + (t===2?' active':'');
    btn.textContent = `${t}×${t}`;
    btn.addEventListener('click', () => {
      tileCount = t;
      document.querySelectorAll('.tile-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (lastArr) renderTilePreview();
    });
    tb.appendChild(btn);
  });

  // Slider listeners
  document.getElementById('octaves').addEventListener('input', e => {
    document.getElementById('octaves-val').textContent = e.target.value;
    schedulePreview();
  });
  document.getElementById('zoom').addEventListener('input', e => {
    document.getElementById('zoom-val').textContent = (e.target.value/4).toFixed(2)+'×';
    schedulePreview();
  });
  document.getElementById('gamma').addEventListener('input', e => {
    document.getElementById('gamma-val').textContent = (e.target.value/10).toFixed(1)+'×';
    if (lastArr) renderTilePreview();
  });
  document.getElementById('bright').addEventListener('input', e => {
    const v = parseInt(e.target.value);
    document.getElementById('bright-val').textContent = v===0?'0.0':(v>0?'+':'')+(v/10).toFixed(1);
    if (lastArr) renderTilePreview();
  });
  document.getElementById('contrast').addEventListener('input', e => {
    document.getElementById('contrast-val').textContent = (e.target.value/100).toFixed(2)+'×';
    if (lastArr) renderTilePreview();
  });
  document.getElementById('lev-lo').addEventListener('input', e => {
    const lo = parseInt(e.target.value);
    const hiEl = document.getElementById('lev-hi');
    if (lo >= parseInt(hiEl.value)) {                     // 黑點不可越過白點
      hiEl.value = Math.min(100, lo + 5);
      document.getElementById('lev-hi-val').textContent = (hiEl.value/100).toFixed(2);
    }
    document.getElementById('lev-lo-val').textContent = (lo/100).toFixed(2);
    if (lastArr) renderTilePreview();
  });
  document.getElementById('lev-hi').addEventListener('input', e => {
    const hi = parseInt(e.target.value);
    const loEl = document.getElementById('lev-lo');
    if (hi <= parseInt(loEl.value)) {                     // 白點不可越過黑點
      loEl.value = Math.max(0, hi - 5);
      document.getElementById('lev-lo-val').textContent = (loEl.value/100).toFixed(2);
    }
    document.getElementById('lev-hi-val').textContent = (hi/100).toFixed(2);
    if (lastArr) renderTilePreview();
  });
  document.getElementById('invert').addEventListener('change', () => { if (lastArr) renderTilePreview(); });
  document.getElementById('seed').addEventListener('input', schedulePreview);
}

function selectType(key) {
  currentType = key;
  document.querySelectorAll('#type-list li').forEach(li => li.classList.toggle('sel', li.dataset.key===key));
  const isFlow = key === 'flowmap';
  document.getElementById('tile-section').style.display = isFlow ? 'none' : '';
  document.getElementById('dissolve-section').style.display = isFlow ? 'none' : '';
  document.getElementById('scroll-section').style.display = isFlow ? 'none' : '';
  document.getElementById('flow-section').style.display = isFlow ? '' : 'none';
  if (isFlow) stopScrollAnim(); else { stopFlowAnim(); startScrollAnim(); }
  schedulePreview();
}

// ============================================================
// Preview
// ============================================================
function schedulePreview() {
  if (debounceId) clearTimeout(debounceId);
  setLive('⬤ 即時預覽  ●', 'var(--dim)');
  debounceId = setTimeout(runPreview, 0);
}

function runPreview() {
  debounceId = null;
  const p = getParams();
  updateResInfo();
  setLive('⬤ 生成中…', 'var(--accent)');
  setStatus('預覽生成中…', 'var(--accent)');
  setTimeout(() => {
    try {
      if (p.type === 'flowmap') {
        const { cx, cy } = generateFlowmapField(PREVIEW_CALC, p.octaves, p.seed, p.freqScale);
        lastFlowCx = cx; lastFlowCy = cy; lastArr = null;
        renderRgbaToCanvas(document.getElementById('preview'), flowmapToRgba(cx, cy), PREVIEW_CALC);
        startFlowAnim(cx, cy, PREVIEW_CALC);
      } else {
        lastArr = GENERATORS[p.type](PREVIEW_CALC, p.octaves, p.seed, p.freqScale);
        renderTilePreview();
      }
      setLive('⬤ 即時預覽', 'var(--green)');
      setStatus(`${p.type}  ${p.size}×${p.size}  seed=${p.seed}  oct=${p.octaves}  ×${p.freqScale.toFixed(2)}`, 'var(--green)');
    } catch(e) {
      setLive('⬤ 錯誤', 'var(--red)');
      setStatus(`⚠ ${e.message}`, 'var(--red)');
    }
  }, 0);
}

function renderTilePreview() {
  if (!lastArr) return;
  const p = getParams();
  const out = postprocess(lastArr, p.gamma, p.invert, p.brightness, p.contrast, p.levLo, p.levHi);
  lastOut = out;
  renderToCanvas(document.getElementById('preview'), out, PREVIEW_CALC, p.colormap);
  renderTiledCanvas(document.getElementById('tile-canvas'), out, PREVIEW_CALC, tileCount, p.colormap);
  renderDissolve();
  updateScrollSource(out, p.colormap);
}

// ============================================================
// Export helpers
// ============================================================
function arrToExportCanvas(arr, size, colormap) {
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  const id = ctx.createImageData(size, size);
  id.data.set(applyColormap(arr, colormap));
  ctx.putImageData(id, 0, 0);
  return canvas;
}

function rgbaToExportCanvas(rgba, size) {
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  const id = ctx.createImageData(size, size);
  id.data.set(rgba); ctx.putImageData(id, 0, 0);
  return canvas;
}

function canvasToBlob(canvas) {
  return new Promise(res => canvas.toBlob(res, 'image/png'));
}

function downloadBlob(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ============================================================
// Save single
// ============================================================
function saveSingle() {
  if (isGenerating) return;
  const p = getParams();
  isGenerating = true;
  setStatus('生成中（完整解析度）…', 'var(--blue)');

  setTimeout(async () => {
    try {
      const name = `${p.type}_${p.size}_${String(p.seed).padStart(4,'0')}.png`;
      let canvas;
      if (p.type === 'flowmap') {
        const { cx, cy } = generateFlowmapField(p.size, p.octaves, p.seed, p.freqScale);
        canvas = rgbaToExportCanvas(flowmapToRgba(cx, cy), p.size);
      } else {
        const arr = GENERATORS[p.type](p.size, p.octaves, p.seed, p.freqScale);
        const out = postprocess(arr, p.gamma, p.invert, p.brightness, p.contrast, p.levLo, p.levHi);
        canvas = arrToExportCanvas(out, p.size, p.colormap);
      }
      const blob = await canvasToBlob(canvas);
      downloadBlob(blob, name);
      setStatus(`✅ 已下載  ${name}`, 'var(--green)');
    } catch(e) {
      setStatus(`⚠ ${e.message}`, 'var(--red)');
    }
    isGenerating = false;
  }, 0);
}

// ============================================================
// Batch generate → ZIP
// ============================================================
async function batchGenerate() {
  if (isGenerating) return;
  const p = getParams();
  const types = p.allTypes ? Object.keys(GENERATORS) : [p.type];
  const total = types.length * p.count;
  let done = 0;
  isGenerating = true;

  const useJSZip = typeof JSZip !== 'undefined';
  const zip = useJSZip ? new JSZip() : null;

  setStatus(`批次生成中… 0/${total}`, 'var(--blue)');
  setProgress(0);

  for (const type of types) {
    for (let i = 0; i < p.count; i++) {
      const seed = p.seed + i;
      const name = `${type}_${p.size}_${String(seed).padStart(4,'0')}.png`;
      setStatus(`生成中… ${done+1}/${total}  ${name}`, 'var(--blue)');
      setProgress(done / total * 100);

      await new Promise(r => setTimeout(r, 0)); // yield to browser

      try {
        let canvas;
        if (type === 'flowmap') {
          const { cx, cy } = generateFlowmapField(p.size, p.octaves, seed, p.freqScale);
          canvas = rgbaToExportCanvas(flowmapToRgba(cx, cy), p.size);
        } else {
          const arr = GENERATORS[type](p.size, p.octaves, seed, p.freqScale);
          const cm = type === 'energy' ? 'gold' : p.colormap;
          const out = postprocess(arr, p.gamma, p.invert, p.brightness, p.contrast, p.levLo, p.levHi);
          canvas = arrToExportCanvas(out, p.size, cm);
        }

        if (zip) {
          const blob = await canvasToBlob(canvas);
          zip.file(name, blob);
        } else {
          const blob = await canvasToBlob(canvas);
          downloadBlob(blob, name);
        }
      } catch(e) {
        console.error(`Error ${name}:`, e);
      }
      done++;
    }
  }

  setProgress(100);

  if (zip) {
    setStatus('壓縮中…', 'var(--blue)');
    await new Promise(r => setTimeout(r, 0));
    const blob = await zip.generateAsync({ type:'blob', compression:'DEFLATE', compressionOptions:{level:6} },
      meta => setProgress(meta.percent));
    const zipName = `NoiseGen_batch_${p.size}_${total}textures.zip`;
    downloadBlob(blob, zipName);
    setStatus(`✅ 完成！${total} 張  →  ${zipName}`, 'var(--green)');
  } else {
    setStatus(`✅ 完成！共 ${total} 張（已逐一下載）`, 'var(--green)');
  }

  setProgress(0);
  isGenerating = false;
}

// ============================================================
// Sync canvas logical size to CSS display size (for correct pixel output)
// ============================================================
function syncCanvasSizes() {
  ['preview','tile-canvas','flow-canvas','dissolve-canvas','scroll-canvas'].forEach(id => {
    const c = document.getElementById(id);
    const w = c.offsetWidth;
    if (w > 0 && (c.width !== w || c.height !== w)) {
      c.width = w;
      c.height = w;
    }
  });
}

let _resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(_resizeTimer);
  _resizeTimer = setTimeout(() => { syncCanvasSizes(); schedulePreview(); }, 120);
});

// ============================================================
// Dissolve preview — threshold 模擬 shader 溶解
// ============================================================
function renderDissolve() {
  if (!lastOut) return;
  const canvas = document.getElementById('dissolve-canvas');
  const t = parseInt(document.getElementById('dissolve-t').value) / 100;
  const edge = 0.06;
  const n = PREVIEW_CALC;
  const off = document.createElement('canvas');
  off.width = n; off.height = n;
  const ctx = off.getContext('2d');
  const id = ctx.createImageData(n, n);
  const d = id.data;
  for (let i = 0; i < n * n; i++) {
    const v = lastOut[i];
    const o = i * 4;
    if (v < t) {
      d[o] = 12; d[o+1] = 12; d[o+2] = 14; d[o+3] = 255;          // 已溶解：深底
    } else if (v < t + edge) {
      d[o] = 255; d[o+1] = 255; d[o+2] = 255; d[o+3] = 255;       // 溶解邊緣：白色發光帶
    } else {
      const g = 150 + ((v - t) * 70) | 0;                          // 本體：亮灰
      d[o] = g; d[o+1] = g; d[o+2] = g; d[o+3] = 255;
    }
  }
  ctx.putImageData(id, 0, 0);
  const dctx = canvas.getContext('2d');
  dctx.imageSmoothingEnabled = true;
  dctx.drawImage(off, 0, 0, canvas.width, canvas.height);
}

// ============================================================
// UV scroll preview — 模擬 shader 內貼圖滾動
// ============================================================
let scrollSrc = null;        // offscreen canvas holding current texture
let scrollRAF = null;
let scrollOff = 0;
let scrollLast = 0;

function updateScrollSource(out, colormap) {
  const n = PREVIEW_CALC;
  if (!scrollSrc) { scrollSrc = document.createElement('canvas'); scrollSrc.width = n; scrollSrc.height = n; }
  const ctx = scrollSrc.getContext('2d');
  const id = ctx.createImageData(n, n);
  id.data.set(applyColormap(out, colormap));
  ctx.putImageData(id, 0, 0);
  startScrollAnim();
}

function scrollFrame(ts) {
  scrollRAF = requestAnimationFrame(scrollFrame);
  if (!scrollSrc) return;
  const canvas = document.getElementById('scroll-canvas');
  const w = canvas.width;
  if (!w) return;
  const dt = scrollLast ? (ts - scrollLast) / 1000 : 0;
  scrollLast = ts;
  const speed = parseInt(document.getElementById('scroll-speed').value) / 10;
  scrollOff = (scrollOff + dt * speed * w * 0.25) % w;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  const ox = scrollOff, oy = scrollOff * 0.5 % w;
  ctx.drawImage(scrollSrc, ox - w, oy - w, w, w);
  ctx.drawImage(scrollSrc, ox,     oy - w, w, w);
  ctx.drawImage(scrollSrc, ox - w, oy,     w, w);
  ctx.drawImage(scrollSrc, ox,     oy,     w, w);
}

function startScrollAnim() {
  if (scrollRAF === null) { scrollLast = 0; scrollRAF = requestAnimationFrame(scrollFrame); }
}
function stopScrollAnim() {
  if (scrollRAF !== null) { cancelAnimationFrame(scrollRAF); scrollRAF = null; }
}

// ============================================================
// URL params — 分享與還原
// ============================================================
function shareURL() {
  const p = getParams();
  const q = new URLSearchParams({
    type: p.type, seed: p.seed, oct: p.octaves,
    zoom: document.getElementById('zoom').value,
    size: p.size, cmap: p.colormap,
    gamma: document.getElementById('gamma').value,
    bright: document.getElementById('bright').value,
    con: document.getElementById('contrast').value,
    llo: document.getElementById('lev-lo').value,
    lhi: document.getElementById('lev-hi').value,
    inv: p.invert ? 1 : 0,
  });
  const url = location.origin + location.pathname + '?' + q.toString();
  const done = () => setStatus('🔗 已複製分享連結', 'var(--green)');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done).catch(() => fallbackCopy(url, done));
  } else {
    fallbackCopy(url, done);
  }
}

function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'absolute'; ta.style.left = '-9999px';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); }
  catch(e) { setStatus('⚠ 複製失敗，請手動複製網址', 'var(--red)'); }
  document.body.removeChild(ta);
}

function applyParamsFromURL() {
  const q = new URLSearchParams(location.search);
  if (![...q.keys()].length) return;
  const type = q.get('type');
  if (type && GENERATORS[type] !== undefined || type === 'flowmap') {
    currentType = type;
    activeTab = tabOfType(type);
    buildTypeTabs();
    buildTypeList();
    const isFlow = type === 'flowmap';
    document.getElementById('tile-section').style.display = isFlow ? 'none' : '';
    document.getElementById('dissolve-section').style.display = isFlow ? 'none' : '';
    document.getElementById('scroll-section').style.display = isFlow ? 'none' : '';
    document.getElementById('flow-section').style.display = isFlow ? '' : 'none';
  }
  if (q.get('seed'))  document.getElementById('seed').value = parseInt(q.get('seed')) || 42;
  if (q.get('oct')) {
    document.getElementById('octaves').value = q.get('oct');
    document.getElementById('octaves-val').textContent = q.get('oct');
  }
  if (q.get('zoom')) {
    document.getElementById('zoom').value = q.get('zoom');
    document.getElementById('zoom-val').textContent = (q.get('zoom')/4).toFixed(2)+'×';
  }
  if (q.get('size')) {
    const r = document.querySelector(`input[name=size][value="${q.get('size')}"]`);
    if (r) r.checked = true;
  }
  if (q.get('cmap')) {
    const r = document.querySelector(`input[name=cmap][value="${q.get('cmap')}"]`);
    if (r) r.checked = true;
  }
  if (q.get('gamma')) {
    document.getElementById('gamma').value = q.get('gamma');
    document.getElementById('gamma-val').textContent = (q.get('gamma')/10).toFixed(1)+'×';
  }
  if (q.get('bright')) {
    const v = parseInt(q.get('bright'));
    document.getElementById('bright').value = v;
    document.getElementById('bright-val').textContent = v===0?'0.0':(v>0?'+':'')+(v/10).toFixed(1);
  }
  if (q.get('con')) {
    document.getElementById('contrast').value = q.get('con');
    document.getElementById('contrast-val').textContent = (q.get('con')/100).toFixed(2)+'×';
  }
  if (q.get('llo')) {
    document.getElementById('lev-lo').value = q.get('llo');
    document.getElementById('lev-lo-val').textContent = (q.get('llo')/100).toFixed(2);
  }
  if (q.get('lhi')) {
    document.getElementById('lev-hi').value = q.get('lhi');
    document.getElementById('lev-hi-val').textContent = (q.get('lhi')/100).toFixed(2);
  }
  if (q.get('inv') === '1') document.getElementById('invert').checked = true;
}

// ============================================================
// Resolution info display
// ============================================================
function updateResInfo() {
  const p = getParams();
  const el = document.getElementById('res-info');
  if (el) el.textContent = p.type + ' · ' + p.size + 'px · seed ' + p.seed;
}

// ============================================================
// Keyboard shortcuts
// ============================================================
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.code === 'Space') { e.preventDefault(); schedulePreview(); }
  if (e.key === 's' || e.key === 'S') saveSingle();
  if (e.key === 'r' || e.key === 'R') randomSeed();
});

// Dissolve / scroll slider listeners
document.getElementById('dissolve-t').addEventListener('input', e => {
  document.getElementById('dissolve-t-val').textContent = e.target.value + '%';
  renderDissolve();
});
document.getElementById('scroll-speed').addEventListener('input', e => {
  document.getElementById('scroll-speed-val').textContent = (e.target.value/10).toFixed(1)+'×';
});

// Init
// ============================================================
buildUI();
applyParamsFromURL();
syncCanvasSizes();
updateResInfo();
schedulePreview();
startScrollAnim();
