<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NoiseGen — Seamless Texture Generator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#19191c;--panel:#2a2a2f;--accent:#e4e4e9;
  --text:#d6d6da;--dim:#8b8b92;
  --green:#4ade80;--blue:#a1a1aa;--red:#f87171;
  --entry:#212126;--surface:#0d0d0f;
  --border:#36363c;--sel-text:#111114;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:12px;height:100vh;overflow:hidden}
/* ── Layout ─── */
.app{width:100%;height:100vh;padding:10px 20px;display:flex;flex-direction:column;gap:0}
h1{
  color:var(--text);font-size:13px;font-weight:600;letter-spacing:.02em;
  padding-bottom:10px;border-bottom:1px solid var(--border);margin-bottom:10px;flex-shrink:0;
  display:flex;align-items:center;gap:8px
}
h1::before{content:'';display:inline-block;width:3px;height:14px;background:var(--accent);border-radius:2px}
.main{display:flex;gap:14px;flex:1;min-height:0;overflow:hidden}
.left{flex:0 0 240px;display:flex;flex-direction:column;gap:0;overflow-y:auto;padding-right:6px}
/* 主預覽 + 縮圖欄 */
.right{flex:1;min-width:0;min-height:0;display:flex;gap:10px;align-items:flex-start;overflow:hidden}
#main-panel{flex:1;min-width:0;max-width:calc(100vh - 130px)}
.thumbs{flex:0 0 clamp(140px, calc((100vh - 202px)/3), 230px);display:flex;flex-direction:column;gap:10px;max-height:100%;overflow-y:auto;padding-right:2px}
.hdr-slider{width:60px;flex:none;accent-color:var(--accent);height:3px;min-width:0}
/* Collapsible sections */
details.section{border-bottom:1px solid var(--border)}
details.section:last-child{border-bottom:none}
details.section>summary{list-style:none;cursor:pointer;color:var(--dim);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:8px 0 4px;display:flex;align-items:center;gap:6px;user-select:none}
details.section>summary::-webkit-details-marker{display:none}
details.section>summary::before{content:'';display:inline-block;width:2px;height:9px;background:var(--accent);border-radius:1px;opacity:.7}
details.section>summary::after{content:'▾';color:var(--dim);font-size:9px;margin-left:auto}
details.section:not([open])>summary::after{content:'▸'}
details.section>summary:hover{color:var(--text)}
/* Type group label inside list */
.type-group-lbl{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);padding:6px 10px 3px;opacity:.65;pointer-events:none;list-style:none}
/* Bottom info strip */
.res-info{color:var(--dim);font-size:10px;font-family:'Consolas',monospace;white-space:nowrap}
.hotkey-hint{color:var(--dim);font-size:10px;opacity:.5;white-space:nowrap;display:none}
@media(min-width:900px){.hotkey-hint{display:block}}
/* ── Section labels ── */
.lbl{
  color:var(--dim);font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  padding:10px 0 5px;display:flex;align-items:center;gap:6px
}
.lbl::before{content:'';display:inline-block;width:2px;height:9px;background:var(--accent);border-radius:1px;opacity:.7}
/* ── Type list ── */
#type-list{list-style:none;background:var(--entry);border-radius:8px;max-height:200px;overflow-y:auto;border:1px solid var(--border)}
#type-list li{padding:6px 10px;cursor:pointer;font-size:11px;white-space:nowrap;transition:background .1s;border-radius:0}
#type-list li:first-child{border-radius:7px 7px 0 0}
#type-list li:last-child{border-radius:0 0 7px 7px}
#type-list li:hover{background:var(--panel)}
#type-list li.sel{background:var(--accent);color:var(--sel-text);font-weight:600}
/* ── Radio ── */
.radio-row{display:flex;gap:6px;flex-wrap:wrap;padding:2px 0}
.radio-row label{display:flex;align-items:center;gap:3px;cursor:pointer;font-size:11px}
input[type=radio]{accent-color:var(--accent)}
/* ── Checkbox ── */
.chk-row{display:flex;align-items:center;gap:6px;padding:3px 0}
.chk-row label{cursor:pointer;font-size:11px;color:var(--dim)}
input[type=checkbox]{accent-color:var(--accent)}
/* ── Sliders ── */
.sl-row{display:flex;align-items:center;gap:8px;padding:3px 0}
.sl-row .sl-lbl{color:var(--dim);font-size:10px;white-space:nowrap;min-width:38px}
.sl-row .sl-val{color:var(--accent);font-weight:700;font-size:11px;min-width:42px;text-align:right;font-family:'Consolas',monospace}
input[type=range]{flex:1;accent-color:var(--accent);height:3px}
/* ── Number input ── */
input[type=number]{background:var(--entry);color:var(--text);border:1px solid var(--border);
  border-radius:6px;padding:4px 8px;font-family:'Consolas',monospace;font-size:11px;outline:none;width:72px;transition:border-color .15s}
input[type=number]:focus{border-color:var(--accent)}
.seed-row{display:flex;gap:6px;align-items:center}
/* ── Buttons ── */
.btn{border:none;border-radius:7px;padding:8px 18px;font-family:'Segoe UI',system-ui,sans-serif;
  font-weight:600;cursor:pointer;font-size:12px;transition:filter .12s,transform .08s;letter-spacing:.01em}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:scale(.97)}
.btn-save{background:var(--accent);color:var(--sel-text)}
.btn-batch{background:var(--panel);color:var(--text);border:1px solid var(--border)}
.btn-batch:hover{background:var(--entry);filter:none}
.btn-rand{background:var(--entry);color:var(--dim);font-size:10px;padding:4px 10px;border:1px solid var(--border);border-radius:5px}
.btn-rand:hover{color:var(--text);background:var(--panel)}
/* ── Canvas panel card ── */
.preview-col{min-width:0;display:flex;flex-direction:column;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.panel-header{background:var(--panel);padding:6px 10px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--border);flex-shrink:0}
canvas{display:block;background:var(--surface);width:100%;aspect-ratio:1;border-radius:0;border:none}
/* ── Status ── */
#status{color:var(--dim);font-size:10px;min-height:18px;padding:4px 0;font-family:'Consolas',monospace}
#live-lbl{font-size:10px;color:var(--green);font-weight:600}
/* ── Bottom bar ── */
.bottom{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 0 3px;border-top:1px solid var(--border);margin-top:6px;flex-shrink:0}
/* ── Scrollbar ── */
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--dim)}
/* ── Tile toggle ── */
.tile-btn{background:var(--entry);color:var(--dim);border:1px solid var(--border);border-radius:5px;
  padding:2px 8px;cursor:pointer;font-family:'Segoe UI',system-ui,sans-serif;font-size:10px;font-weight:500;transition:background .1s}
.tile-btn:hover{color:var(--text)}
.tile-btn.active{background:var(--accent);color:var(--sel-text);border-color:var(--accent)}
/* ── Progress ── */
#progress{height:2px;background:var(--accent);transition:width .2s;border-radius:2px;margin-top:2px}
#progress-wrap{background:var(--border);border-radius:2px;overflow:hidden;display:none}
/* ── Responsive ── */
@media(max-width:640px){
  body{overflow:auto}
  .app{padding:10px 14px;height:auto}
  h1{font-size:12px;padding-bottom:8px;margin-bottom:8px}
  .main{flex-direction:column;gap:10px;overflow:visible}
  .left{flex:none;width:100%;order:2}
  /* 手機：主預覽與縮圖全部直排 */
  .right{flex:none;width:100%;order:1;flex-direction:column;overflow:visible;max-height:none}
  #main-panel{flex:none;width:100%}
  #main-panel canvas{width:100%}
  .thumbs{flex:none;width:100%;max-height:none;overflow:visible}
  #type-list{max-height:150px}
  .lbl{padding:6px 0 3px}
  .bottom{gap:8px}
  .btn-save,.btn-batch{flex:1 1 100%;text-align:center}
}
</style>
</head>
<body>
<div class="app">
  <h1>NoiseGen — Seamless Turbulence Texture Generator</h1>
  <div class="main">
    <!-- ── Left panel ── -->
    <div class="left">
      <details class="section" open>
        <summary class="sec-hdr">噪波類型</summary>
        <ul id="type-list"></ul>
      </details>

      <details class="section" open>
        <summary class="sec-hdr">解析度</summary>
        <div class="radio-row" id="size-row" style="padding-bottom:4px"></div>
      </details>

      <details class="section" open>
        <summary class="sec-hdr">隨機種子</summary>
        <div class="seed-row" style="padding-bottom:6px">
          <input type="number" id="seed" value="42" min="0" max="99999">
          <button class="btn btn-rand" onclick="randomSeed()">🎲 隨機</button>
        </div>
      </details>

      <details class="section" open>
        <summary class="sec-hdr">參數調整</summary>
        <div class="sl-row">
          <span class="sl-lbl">細節層</span>
          <input type="range" id="octaves" min="4" max="12" value="8">
          <span class="sl-val" id="octaves-val">8</span>
        </div>
        <div class="sl-row">
          <span class="sl-lbl">縮放</span>
          <input type="range" id="zoom" min="1" max="16" value="4">
          <span class="sl-val" id="zoom-val">1.00×</span>
        </div>
        <div class="radio-row" id="cmap-row" style="padding:4px 0 2px"></div>
      </details>

      <details class="section">
        <summary class="sec-hdr">後處理</summary>
        <div class="chk-row"><input type="checkbox" id="invert"><label for="invert">反轉</label></div>
        <div class="sl-row">
          <span class="sl-lbl">Gamma</span>
          <input type="range" id="gamma" min="2" max="30" value="10">
          <span class="sl-val" id="gamma-val">1.0×</span>
        </div>
        <div class="sl-row">
          <span class="sl-lbl">亮度</span>
          <input type="range" id="bright" min="-10" max="10" value="0">
          <span class="sl-val" id="bright-val">0.0</span>
        </div>
      </details>

      <details class="section">
        <summary class="sec-hdr">批次下載</summary>
        <div class="sl-row" style="padding-bottom:2px">
          <span class="sl-lbl">數量</span>
          <input type="number" id="count" value="5" min="1" max="50" style="width:60px">
        </div>
        <div class="chk-row" style="padding-bottom:6px">
          <input type="checkbox" id="all-types">
          <label for="all-types">全部類型一起生成</label>
        </div>
      </details>
    </div>

    <!-- ── Right panel ── -->
    <div class="right">
      <!-- 即時預覽（主面板） -->
      <div class="preview-col" id="main-panel">
        <div class="panel-header">
          <span id="live-lbl" style="font-size:10px;font-weight:600;color:var(--green)">⬤ 即時預覽</span>
          <span id="res-info" class="res-info" style="margin-left:auto"></span>
        </div>
        <canvas id="preview" width="300" height="300"></canvas>
      </div>

      <!-- 縮圖欄 -->
      <div class="thumbs">
        <!-- Tile section (hidden for flowmap) -->
        <div id="tile-section" class="preview-col">
          <div class="panel-header">
            <span style="font-size:10px;font-weight:600;color:var(--dim)">拼貼</span>
            <span id="tile-btns" style="margin-left:auto"></span>
          </div>
          <canvas id="tile-canvas" width="300" height="300"></canvas>
        </div>

        <!-- Flow section (only for flowmap) -->
        <div id="flow-section" class="preview-col" style="display:none">
          <div class="panel-header">
            <span style="font-size:10px;font-weight:600;color:var(--dim)">流動預覽</span>
            <span style="font-size:9px;color:var(--dim);opacity:.6;margin-left:auto">粒子速度場</span>
          </div>
          <canvas id="flow-canvas" width="300" height="300"></canvas>
        </div>

        <!-- Dissolve preview (hidden for flowmap) -->
        <div id="dissolve-section" class="preview-col">
          <div class="panel-header">
            <span style="font-size:10px;font-weight:600;color:var(--dim)">溶解</span>
            <input type="range" id="dissolve-t" min="0" max="100" value="50" class="hdr-slider" style="margin-left:auto">
            <span id="dissolve-t-val" class="res-info" style="min-width:28px;text-align:right">50%</span>
          </div>
          <canvas id="dissolve-canvas" width="300" height="300"></canvas>
        </div>

        <!-- UV scroll preview (hidden for flowmap) -->
        <div id="scroll-section" class="preview-col">
          <div class="panel-header">
            <span style="font-size:10px;font-weight:600;color:var(--dim)">UV 滾動</span>
            <input type="range" id="scroll-speed" min="0" max="40" value="12" class="hdr-slider" style="margin-left:auto">
            <span id="scroll-speed-val" class="res-info" style="min-width:28px;text-align:right">1.2×</span>
          </div>
          <canvas id="scroll-canvas" width="300" height="300"></canvas>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Bottom bar ── -->
  <div class="bottom">
    <button class="btn btn-save" onclick="saveSingle()">↓ 下載 PNG</button>
    <button class="btn btn-batch" onclick="batchGenerate()">⊞ 批次 ZIP</button>
    <button class="btn btn-batch" onclick="shareURL()">🔗 分享連結</button>
    <div id="status" style="color:var(--dim);font-size:10px;font-family:'Consolas',monospace">就緒</div>
    <div id="progress-wrap" style="width:80px"><div id="progress" style="width:0%"></div></div>
    <div style="flex:1"></div>
    <span class="hotkey-hint">Space 重新生成 &nbsp;·&nbsp; S 下載 &nbsp;·&nbsp; R 隨機種子</span>
  </div>
</div>

<!-- JSZip for batch download -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" crossorigin="anonymous"></script>

<script>
"use strict";

// ============================================================
// PRNG — xorshift32 (seeded, deterministic)
// ============================================================
class RNG {
  constructor(seed) { this.s = (seed >>> 0) || 1; }
  next() {
    let s = this.s;
    s ^= s << 13; s ^= s >>> 17; s ^= s << 5;
    this.s = s >>> 0;
    return this.s / 4294967296;
  }
  rand() { return this.next(); }
  randInt(lo, hi) { return lo + Math.floor(this.next() * (hi - lo + 1)); }
}

// ============================================================
// Core — seamlessly-tiling value noise octave
// ============================================================
function valueNoiseOctave(size, freq, seed) {
  const rng = new RNG(seed);
  const fp1 = freq + 1;
  const grid = new Float32Array(freq * freq);
  for (let i = 0; i < grid.length; i++) grid[i] = rng.rand();

  const gp = new Float32Array(fp1 * fp1);
  for (let y = 0; y < freq; y++)
    for (let x = 0; x < freq; x++)
      gp[y * fp1 + x] = grid[y * freq + x];
  for (let x = 0; x < freq; x++) gp[freq * fp1 + x] = grid[x];
  for (let y = 0; y < freq; y++) gp[y * fp1 + freq] = grid[y * freq];
  gp[freq * fp1 + freq] = grid[0];

  const out = new Float32Array(size * size);
  for (let j = 0; j < size; j++) {
    const gy = j * freq / size;
    const y0 = Math.floor(gy) | 0;
    let ty = gy - y0;
    ty = ty * ty * ty * (ty * (ty * 6 - 15) + 10);
    const iy0 = y0 * fp1, iy1 = (y0 + 1) * fp1;
    for (let i = 0; i < size; i++) {
      const gx = i * freq / size;
      const x0 = Math.floor(gx) | 0;
      let tx = gx - x0;
      tx = tx * tx * tx * (tx * (tx * 6 - 15) + 10);
      out[j * size + i] =
        gp[iy0+x0]*(1-tx)*(1-ty) + gp[iy0+x0+1]*tx*(1-ty) +
        gp[iy1+x0]*(1-tx)*ty     + gp[iy1+x0+1]*tx*ty;
    }
  }
  return out;
}

// ============================================================
// Core — FBM (fractional Brownian motion, value noise)
// ============================================================
function fbm(size, octaves=8, baseFreq=2, lacunarity=2.0, persistence=0.55, seed=0, freqScale=1.0) {
  const rng = new RNG(seed);
  const result = new Float32Array(size * size);
  let amp = 1.0, total = 0.0;
  let freq = Math.max(1, Math.round(baseFreq * freqScale));
  for (let oct = 0; oct < octaves; oct++) {
    if (freq > size) break;
    const layer = valueNoiseOctave(size, freq, Math.floor(rng.rand() * 999999));
    for (let i = 0; i < result.length; i++) result[i] += layer[i] * amp;
    total += amp; amp *= persistence; freq = Math.floor(freq * lacunarity);
  }
  for (let i = 0; i < result.length; i++) result[i] /= total;
  return result;
}

// ============================================================
// Core — Perlin gradient noise octave (seamless)
// ============================================================
function gradientNoiseOctave(size, freq, seed) {
  const rng = new RNG(seed);
  const fp1 = freq + 1;
  const angles = new Float32Array(freq * freq);
  for (let i = 0; i < angles.length; i++) angles[i] = rng.rand() * 2 * Math.PI;

  const gpx = new Float32Array(fp1 * fp1);
  const gpy = new Float32Array(fp1 * fp1);
  for (let y = 0; y < freq; y++) for (let x = 0; x < freq; x++) {
    gpx[y*fp1+x] = Math.cos(angles[y*freq+x]);
    gpy[y*fp1+x] = Math.sin(angles[y*freq+x]);
  }
  for (let x = 0; x < freq; x++) {
    gpx[freq*fp1+x] = Math.cos(angles[x]);
    gpy[freq*fp1+x] = Math.sin(angles[x]);
  }
  for (let y = 0; y < freq; y++) {
    gpx[y*fp1+freq] = Math.cos(angles[y*freq]);
    gpy[y*fp1+freq] = Math.sin(angles[y*freq]);
  }
  gpx[freq*fp1+freq] = Math.cos(angles[0]);
  gpy[freq*fp1+freq] = Math.sin(angles[0]);

  const out = new Float32Array(size * size);
  for (let j = 0; j < size; j++) {
    const py = j * freq / size;
    const y0 = Math.floor(py) | 0;
    const fy = py - y0;
    const v = fy * fy * fy * (fy * (fy * 6 - 15) + 10);
    const iy0 = y0 * fp1, iy1 = (y0+1) * fp1;
    for (let i = 0; i < size; i++) {
      const px = i * freq / size;
      const x0 = Math.floor(px) | 0;
      const fx = px - x0;
      const u = fx * fx * fx * (fx * (fx * 6 - 15) + 10);
      const n00 = gpx[iy0+x0]*fx       + gpy[iy0+x0]*fy;
      const n10 = gpx[iy0+x0+1]*(fx-1) + gpy[iy0+x0+1]*fy;
      const n01 = gpx[iy1+x0]*fx       + gpy[iy1+x0]*(fy-1);
      const n11 = gpx[iy1+x0+1]*(fx-1) + gpy[iy1+x0+1]*(fy-1);
      const raw = n00*(1-u)*(1-v) + n10*u*(1-v) + n01*(1-u)*v + n11*u*v;
      out[j*size+i] = Math.max(0, Math.min(1, raw / 0.707 * 0.5 + 0.5));
    }
  }
  return out;
}

function gradientFbm(size, octaves=8, baseFreq=2, lacunarity=2.0, persistence=0.5, seed=0, freqScale=1.0) {
  const rng = new RNG(seed);
  const result = new Float32Array(size * size);
  let amp = 1.0, total = 0.0;
  let freq = Math.max(1, Math.round(baseFreq * freqScale));
  for (let oct = 0; oct < octaves; oct++) {
    if (freq > size) break;
    const layer = gradientNoiseOctave(size, freq, Math.floor(rng.rand() * 999999));
    for (let i = 0; i < result.length; i++) result[i] += layer[i] * amp;
    total += amp; amp *= persistence; freq = Math.floor(freq * lacunarity);
  }
  for (let i = 0; i < result.length; i++) result[i] /= total;
  return result;
}

// ============================================================
// Helpers
// ============================================================
function mapCoordsBilinear(arr, H, W, coordsY, coordsX) {
  const N = coordsY.length, out = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    const py = ((coordsY[i] % H) + H) % H;
    const px = ((coordsX[i] % W) + W) % W;
    const y0 = Math.floor(py) | 0, x0 = Math.floor(px) | 0;
    const y1 = (y0+1) % H, x1 = (x0+1) % W;
    const fy = py - Math.floor(py), fx = px - Math.floor(px);
    out[i] = arr[y0*W+x0]*(1-fy)*(1-fx) + arr[y0*W+x1]*(1-fy)*fx +
             arr[y1*W+x0]*fy*(1-fx)      + arr[y1*W+x1]*fy*fx;
  }
  return out;
}

// np.roll(arr, shift, axis=0) → result[y] = arr[(y - shift + H) % H]
function rollRows(arr, H, W, shift) {
  const out = new Float32Array(H * W);
  for (let y = 0; y < H; y++) {
    const sy = ((y - shift) % H + H) % H;
    for (let x = 0; x < W; x++) out[y*W+x] = arr[sy*W+x];
  }
  return out;
}

// np.roll(arr, shift, axis=1) → result[y,x] = arr[y, (x - shift + W) % W]
function rollCols(arr, H, W, shift) {
  const out = new Float32Array(H * W);
  for (let y = 0; y < H; y++)
    for (let x = 0; x < W; x++)
      out[y*W+x] = arr[y*W + ((x - shift + W) % W)];
  return out;
}

function normalize(arr) {
  let lo = Infinity, hi = -Infinity;
  for (let i = 0; i < arr.length; i++) { if (arr[i] < lo) lo = arr[i]; if (arr[i] > hi) hi = arr[i]; }
  const r = hi - lo + 1e-8, out = new Float32Array(arr.length);
  for (let i = 0; i < arr.length; i++) out[i] = (arr[i] - lo) / r;
  return out;
}

function clamp01(arr) {
  const out = new Float32Array(arr.length);
  for (let i = 0; i < arr.length; i++) out[i] = Math.max(0, Math.min(1, arr[i]));
  return out;
}

function generateCloud(size, octaves, seed, freqScale) {

function generateTurbulence(size, octaves, seed, freqScale) {

function generateMarble(size, octaves, seed, freqScale) {

function generateEnergy(size, octaves, seed, freqScale) {

  const det = fbm(size, 5, 8, 2.0, 0.4, seed+500);

    let v = 1 - Math.abs(n[i]*2-1);

    let d = 1 - Math.abs(det[i]*2-1);

function generateVoronoi(size, octaves, seed, freqScale) {
  const C = Math.max(2, Math.round(Math.max(4, octaves*3)*freqScale));
  const rng = new RNG(seed);
  const pts = new Float32Array(C*2);
  for (let i = 0; i < C*2; i++) pts[i] = rng.rand();

  const f1 = new Float32Array(size*size).fill(Infinity);
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) for (let c = 0; c < C; c++) {
    const pcx = pts[c*2]+dx, pcy = pts[c*2+1]+dy;
    for (let j = 0; j < size; j++) {
      const dyy = j/size - pcy;
      for (let i = 0; i < size; i++) {
        const dxx = i/size - pcx;
        const d = Math.sqrt(dxx*dxx+dyy*dyy);
        const idx = j*size+i;
        if (d < f1[idx]) f1[idx] = d;
      }
    }
  }
  let mx = 0; for (let i = 0; i < f1.length; i++) if (f1[i] > mx) mx = f1[i];
  mx += 1e-8;
  for (let i = 0; i < f1.length; i++) f1[i] = 1 - f1[i]/mx;
  return f1;
}

function generateCrackle(size, octaves, seed, freqScale) {
  const C = Math.max(2, Math.round(Math.max(4, octaves*2)*freqScale));
  const rng = new RNG(seed);
  const pts = new Float32Array(C*2);
  for (let i = 0; i < C*2; i++) pts[i] = rng.rand();

  const f1 = new Float32Array(size*size).fill(Infinity);
  const f2 = new Float32Array(size*size).fill(Infinity);
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) for (let c = 0; c < C; c++) {
    const pcx = pts[c*2]+dx, pcy = pts[c*2+1]+dy;
    for (let j = 0; j < size; j++) {
      const dyy = j/size - pcy;
      for (let i = 0; i < size; i++) {
        const dxx = i/size - pcx;
        const d = Math.sqrt(dxx*dxx+dyy*dyy);
        const idx = j*size+i;
        if (d < f1[idx]) { f2[idx] = f1[idx]; f1[idx] = d; }
        else if (d < f2[idx]) f2[idx] = d;
      }
    }
  }
  const out = new Float32Array(size*size);
  let mx = 0;
  for (let i = 0; i < out.length; i++) { out[i] = f2[i]-f1[i]; if (out[i] > mx) mx = out[i]; }
  mx += 1e-8;
  for (let i = 0; i < out.length; i++) out[i] = Math.pow(out[i]/mx, 0.6);
  return out;
}

function generateRidged(size, octaves, seed, freqScale) {
  const rng = new RNG(seed);
  const result = new Float32Array(size*size);
  const weight = new Float32Array(size*size).fill(1);
  let freq = Math.max(1, Math.round(2*freqScale)), amp = 0.5;

    for (let i = 0; i < result.length; i++) {
      let sig = 1 - Math.abs(layer[i]*2-1); sig *= sig; sig *= weight[i];
      result[i] += sig * amp; weight[i] = Math.max(0, Math.min(1, sig));
    }
    amp *= 0.5; freq = Math.floor(freq * 2);
  }
  return normalize(result);
}

function generateBillow(size, octaves, seed, freqScale) {
  const n = fbm(size, octaves, 2, 2.0, 0.55, seed, freqScale);

}

function generateWispy(size, octaves, seed, freqScale) {
  const n = fbm(size, octaves, 4, 2.2, 0.45, seed, freqScale);
  for (let i = 0; i < n.length; i++) n[i] = Math.pow(Math.max(0, 1-Math.abs(n[i]*2-1)), 3);
  const wx = fbm(size, 4, 2, 2.0, 0.55, seed+1000);
  const wy = fbm(size, 3, 2, 2.0, 0.55, seed+2000);
  const N = size*size;
  const cx = new Float32Array(N), cy = new Float32Array(N);
  for (let j = 0; j < size; j++) for (let i = 0; i < size; i++) {
    const idx = j*size+i;
    cx[idx] = (((i/size)+(wx[idx]-0.5)*0.7)%1+1)%1*size;
    cy[idx] = (((j/size)+(wy[idx]-0.5)*0.15)%1+1)%1*size;
  }

function generateCurl(size, octaves, seed, freqScale) {
  const phi  = fbm(size, octaves, 2, 2.0, 0.5, seed, freqScale);

  const rp1  = rollRows(phi, size, size,  1); // phi[y-1]
  const cm1  = rollCols(phi, size, size, -1); // phi[x+1]

    const curlX = (rm1[idx]-rp1[idx])*0.5;
    const curlY = -(cm1[idx]-cp1[idx])*0.5;

    cy[idx] = (((j/size)+curlY*2.5)%1+1)%1*size;

function generatePerlin(size, octaves, seed, freqScale) {
  const n = gradientFbm(size, octaves, 2, 2.0, 0.5, seed, freqScale);

function generateVoronoise(size, octaves, seed, freqScale) {
  const C = Math.max(3, Math.round(Math.max(5, octaves*2)*freqScale));
  const rng = new RNG(seed);
  const pts = new Float32Array(C*2), vals = new Float32Array(C);
  for (let i = 0; i < C*2; i++) pts[i] = rng.rand();
  for (let i = 0; i < C; i++) vals[i] = rng.rand();
  const k = 6.0 * C;
  const sumW = new Float32Array(size*size), sumWV = new Float32Array(size*size);
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) for (let c = 0; c < C; c++) {
    const pcx = pts[c*2]+dx, pcy = pts[c*2+1]+dy, v = vals[c];
    for (let j = 0; j < size; j++) {
      const dyy = j/size - pcy;
      for (let i = 0; i < size; i++) {
        const dxx = i/size - pcx;
        const w = Math.exp(-k*(dxx*dxx+dyy*dyy));
        const idx = j*size+i; sumW[idx] += w; sumWV[idx] += w*v;
      }
    }
  }
  const out = new Float32Array(size*size);
  for (let i = 0; i < out.length; i++) out[i] = sumW[i] > 1e-8 ? sumWV[i]/sumW[i] : 0;
  return normalize(out);
}

function generateHetero(size, octaves, seed, freqScale) {
  const rng = new RNG(seed), offset = 0.7;
  let freq = Math.max(1, Math.round(2*freqScale));
  const first = valueNoiseOctave(size, freq, Math.floor(rng.rand()*999999));
  const result = new Float32Array(size*size);
  for (let i = 0; i < result.length; i++) result[i] = first[i]+offset;
  let amp = 0.5; freq = Math.floor(freq*2);
  for (let oct = 1; oct < octaves; oct++) {
    if (freq > size) break;
    const layer = valueNoiseOctave(size, freq, Math.floor(rng.rand()*999999));
    for (let i = 0; i < result.length; i++) result[i] += amp*(layer[i]+offset)*result[i];
    amp *= 0.45; freq = Math.floor(freq*2);
  }
  return normalize(result);
}

function generateDistort(size, octaves, seed, freqScale) {
  const rng = new RNG(seed);
  const result = new Float32Array(size*size);
  const shX = new Float32Array(size*size), shY = new Float32Array(size*size);
  let amp = 1.0, total = 0.0, freq = Math.max(1, Math.round(2*freqScale));
  for (let oct = 0; oct < octaves; oct++) {
    if (freq > size) break;
    const base = valueNoiseOctave(size, freq, Math.floor(rng.rand()*999999));
    const N = size*size;
    const px = new Float32Array(N), py = new Float32Array(N);
    for (let j = 0; j < size; j++) for (let i = 0; i < size; i++) {
      const idx = j*size+i;
      px[idx] = (((i/size)+shX[idx])%1+1)%1*size;
      py[idx] = (((j/size)+shY[idx])%1+1)%1*size;
    }
    const layer = mapCoordsBilinear(base, size, size, py, px);
    const decay = 0.30/(oct+1);
    for (let i = 0; i < N; i++) {
      result[i] += layer[i]*amp;
      shX[i] += (layer[i]-0.5)*decay;
      shY[i] += (layer[i]-0.5)*decay*0.65;
    }
    total += amp; amp *= 0.5; freq = Math.floor(freq*2);
  }
  for (let i = 0; i < result.length; i++) result[i] /= total;
  return normalize(result);

function generateFlowmapField(size, octaves, seed, freqScale) {
  const phi = fbm(size, octaves, 2, 2.0, 0.5, seed, freqScale);
  const rm1 = rollRows(phi, size, size, -1), rp1 = rollRows(phi, size, size, 1);
  const cm1 = rollCols(phi, size, size, -1), cp1 = rollCols(phi, size, size, 1);
  const cx = new Float32Array(size*size), cy = new Float32Array(size*size);
  for (let i = 0; i < size*size; i++) {
    cx[i] = (rm1[i]-rp1[i])*0.5;
    cy[i] = -(cm1[i]-cp1[i])*0.5;
  }
  let mx = 1e-8;
  for (let i = 0; i < size*size; i++) { const m = Math.sqrt(cx[i]*cx[i]+cy[i]*cy[i]); if (m > mx) mx = m; }
  for (let i = 0; i < size*size; i++) { cx[i] /= mx; cy[i] /= mx; }
  return { cx, cy };
}

function flowmapToRgba(cx, cy) {
  const N = cx.length, out = new Uint8ClampedArray(N*4);
  for (let i = 0; i < N; i++) {
    out[i*4+0] = Math.round((cx[i]*0.5+0.5)*255);
    out[i*4+1] = Math.round((cy[i]*0.5+0.5)*255);
    out[i*4+2] = 128; out[i*4+3] = 255;
  }
  return out;
}

function generateFlowmapGray(size, octaves, seed, freqScale) {
  const { cx, cy } = generateFlowmapField(size, octaves, seed, freqScale);
  const out = new Float32Array(size*size);
  for (let i = 0; i < size*size; i++) out[i] = Math.sqrt(cx[i]*cx[i]+cy[i]*cy[i]);
  return out;
}

// UE-style generators — polar sprites & patterns

function generateShockwave(size, octaves, seed, freqScale) {
  const n = fbm(size, Math.min(octaves, 6), 3, 2.0, 0.5, seed, 1);
  const rings = Math.max(3, Math.round(8 * freqScale));
  const out = new Float32Array(size * size);
  for (let j = 0; j < size; j++) {
    const dy = j / size - 0.5;
    for (let i = 0; i < size; i++) {
      const dx = i / size - 0.5;
      const idx = j * size + i;
      const r = Math.sqrt(dx * dx + dy * dy);
      const distort = (n[idx] - 0.5) * 0.10;
      let w = Math.sin((r + distort) * rings * Math.PI * 2 - Math.PI / 2) * 0.5 + 0.5;
      w = Math.pow(w, 2.5);
      out[idx] = w * Math.max(0, 1 - r * 2);
    }
  }
  return out;
}

function generateStreaks(size, octaves, seed, freqScale) {
  const base = fbm(size, octaves, 4, 2.0, 0.5, seed, 1);
  const N = size * size;
  const rows = new Float32Array(N), cols = new Float32Array(N);
  for (let j = 0; j < size; j++) {
    const dy = j / size - 0.5;
    for (let i = 0; i < size; i++) {
      const dx = i / size - 0.5;
      const idx = j * size + i;
      const r = Math.sqrt(dx * dx + dy * dy);
      const a = Math.atan2(dy, dx) / (Math.PI * 2) + 0.5;   // 0..1, wraps with tiling fbm
      cols[idx] = a * size;
      rows[idx] = r * size * 0.35 * freqScale;               // radially stretched
    }
  }
  const s = mapCoordsBilinear(base, size, size, rows, cols);
  const out = new Float32Array(N);
  for (let j = 0; j < size; j++) {
    const dy = j / size - 0.5;
    for (let i = 0; i < size; i++) {
      const dx = i / size - 0.5;
      const idx = j * size + i;
      const r = Math.sqrt(dx * dx + dy * dy);
      const v = Math.pow(Math.max(0, s[idx] - 0.35) / 0.65, 1.6);
      out[idx] = v * Math.max(0, 1 - r * 2) * Math.min(1, r * 14);
    }
  }
  return normalize(out);
}

function generateVortex(size, octaves, seed, freqScale) {
  const base = fbm(size, octaves, 3, 2.0, 0.55, seed, freqScale);
  const N = size * size;
  const rows = new Float32Array(N), cols = new Float32Array(N);
  const twist = 9;
  for (let j = 0; j < size; j++) {
    const dy = j / size - 0.5;
    for (let i = 0; i < size; i++) {
      const dx = i / size - 0.5;
      const idx = j * size + i;
      const r = Math.sqrt(dx * dx + dy * dy);
      const a = Math.atan2(dy, dx) + r * twist;
      cols[idx] = (((0.5 + Math.cos(a) * r) % 1) + 1) % 1 * size;
      rows[idx] = (((0.5 + Math.sin(a) * r) % 1) + 1) % 1 * size;
    }
  }
  const s = mapCoordsBilinear(base, size, size, rows, cols);
  const out = new Float32Array(N);
  for (let j = 0; j < size; j++) {
    const dy = j / size - 0.5;
    for (let i = 0; i < size; i++) {
      const dx = i / size - 0.5;
      const idx = j * size + i;
      const r = Math.sqrt(dx * dx + dy * dy);
      out[idx] = s[idx] * Math.max(0, 1 - r * 1.6);
    }
  }
  return normalize(out);

function generateCaustics(size, octaves, seed, freqScale) {
  const C = Math.max(4, Math.round(Math.max(4, octaves * 2) * freqScale));
  const rng = new RNG(seed);
  const pts = new Float32Array(C * 2);
  for (let i = 0; i < C * 2; i++) pts[i] = rng.rand();

  const f1 = new Float32Array(size * size).fill(Infinity);
  const f2 = new Float32Array(size * size).fill(Infinity);
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) for (let c = 0; c < C; c++) {
    const pcx = pts[c * 2] + dx, pcy = pts[c * 2 + 1] + dy;
    for (let j = 0; j < size; j++) {
      const dyy = j / size - pcy;
      for (let i = 0; i < size; i++) {
        const dxx = i / size - pcx;
        const d = Math.sqrt(dxx * dxx + dyy * dyy);
        const idx = j * size + i;
        if (d < f1[idx]) { f2[idx] = f1[idx]; f1[idx] = d; }
        else if (d < f2[idx]) f2[idx] = d;
      }

  }
  const out = new Float32Array(size * size);
  let mx = 0;
  for (let i = 0; i < out.length; i++) { out[i] = f2[i] - f1[i]; if (out[i] > mx) mx = out[i]; }
  mx += 1e-8;
  for (let i = 0; i < out.length; i++) out[i] = Math.pow(1 - out[i] / mx, 6);   // 反轉邊緣 → 亮焦散網

function generateElectric(size, octaves, seed, freqScale) {
  const n = fbm(size, octaves, 3, 2.0, 0.5, seed, freqScale);
  const out = new Float32Array(n.length);
  for (let i = 0; i < n.length; i++) {
    out[i] = Math.min(1, 0.02 / (Math.abs(n[i] - 0.5) + 0.012));
  }
  return out;
}

function generateHex(size, octaves, seed, freqScale) {
  const C = Math.max(3, Math.round(6 * freqScale));
  const R = Math.max(2, Math.round(C * 1.1547 / 2) * 2);   // 偶數列 → 垂直無縫
  const mod = fbm(size, 4, 2, 2.0, 0.5, seed, 1);
  const out = new Float32Array(size * size);
  for (let j = 0; j < size; j++) {
    const v = j / size;
    for (let i = 0; i < size; i++) {
      const u = i / size;
      const idx = j * size + i;
      let x = u * C;
      const y = v * R;
      if (Math.floor(y) % 2) x += 0.5;
      const fx = Math.abs(x - Math.floor(x) - 0.5) * 2;
      const fy = Math.abs(y - Math.floor(y) - 0.5) * 2;
      const d = Math.max(fx, fy * 0.85 + fx * 0.3);
      const line = d > 0.80 ? 1 : 0.10;
      out[idx] = Math.max(0, Math.min(1, line * (0.55 + mod[idx] * 0.55)));
    }
  }
  return out;
}

function generateSparkle(size, octaves, seed, freqScale) {
  const C = Math.max(8, Math.round(40 * freqScale));
  const rng = new RNG(seed);
  const px = new Float32Array(C), py = new Float32Array(C), sz = new Float32Array(C), br = new Float32Array(C);
  const soft = octaves / 8;
  for (let c = 0; c < C; c++) {
    px[c] = rng.rand(); py[c] = rng.rand();
    const t = rng.rand();
    sz[c] = (0.0008 + t * t * 0.004) * soft;
    br[c] = 0.5 + rng.rand() * 0.5;
  }
  const out = new Float32Array(size * size);
  for (let j = 0; j < size; j++) {
    const vy = j / size;
    for (let i = 0; i < size; i++) {
      const vx = i / size;
      const idx = j * size + i;
      let b = 0;
      for (let c = 0; c < C; c++) {
        let dx = Math.abs(vx - px[c]); if (dx > 0.5) dx = 1 - dx;   // wrapped → 無縫
        let dy = Math.abs(vy - py[c]); if (dy > 0.5) dy = 1 - dy;
        const d2 = dx * dx + dy * dy;
        if (d2 > sz[c] * 9) continue;
        b += Math.exp(-d2 / sz[c]) * br[c];
      }
      out[idx] = Math.min(1, b);
    }
  }
  return out;
}

function generateGrain(size, octaves, seed, freqScale) {
  const block = Math.max(1, Math.round(1 / freqScale));
  const rng = new RNG(seed);
  const cells = Math.ceil(size / block);
  const vals = new Float32Array(cells * cells);
  for (let i = 0; i < vals.length; i++) vals[i] = rng.rand();
  const out = new Float32Array(size * size);
  for (let j = 0; j < size; j++) {
    const cj = Math.floor(j / block) % cells;
    for (let i = 0; i < size; i++) {
      out[j * size + i] = vals[cj * cells + Math.floor(i / block) % cells];
    }
  }
  return out;
}

// ============================================================
// Color maps + post-processing
// ============================================================
function applyColormap(arr, colormap) {
  const N = arr.length, out = new Uint8ClampedArray(N*4);
  if (colormap === 'gold') {
    for (let i = 0; i < N; i++) {
      const g = arr[i];
      out[i*4]   = Math.round(Math.pow(Math.max(0,Math.min(1,g)),     0.55)*255);
      out[i*4+1] = Math.round(Math.pow(Math.max(0,Math.min(1,g*0.78)),0.75)*255);
      out[i*4+2] = Math.round(Math.pow(Math.max(0,Math.min(1,g*0.18)),1.50)*255);
      out[i*4+3] = 255;
    }
  } else if (colormap === 'plasma') {
    for (let i = 0; i < N; i++) {
      const g = arr[i];
      out[i*4]   = Math.round(Math.pow(Math.max(0,Math.min(1,g*1.20)),0.80)*255);
      out[i*4+1] = Math.round(Math.pow(Math.max(0,Math.min(1,g*0.40)),1.50)*255);
      out[i*4+2] = Math.round(Math.pow(Math.max(0,Math.min(1,g*1.50)),0.60)*255);
      out[i*4+3] = 255;
    }
  } else {
    for (let i = 0; i < N; i++) {
      const v = Math.round(arr[i]*255);
      out[i*4]=v; out[i*4+1]=v; out[i*4+2]=v; out[i*4+3]=255;
    }
  }
  return out;
}

function postprocess(arr, gamma=1.0, invert=false, brightness=0.0) {
  const out = new Float32Array(arr.length);
  for (let i = 0; i < arr.length; i++) {
    let v = arr[i];
    if (brightness !== 0) v = Math.max(0, Math.min(1, v+brightness));
    if (gamma !== 1) v = Math.pow(Math.max(0, v), gamma);
    if (invert) v = 1-v;
    out[i] = v;
  }
  return out;
}

// ============================================================
// Canvas rendering
// ============================================================
const PREVIEW_SIZE = 300;
const PREVIEW_CALC = 128;

function arrToImageData(ctx, arr, size, colormap) {
  const id = ctx.createImageData(size, size);
  id.data.set(applyColormap(arr, colormap));
  return id;
}

function renderToCanvas(canvas, arr, size, colormap) {
  const ctx = canvas.getContext('2d');
  const tmp = document.createElement('canvas');
  tmp.width = size; tmp.height = size;
  tmp.getContext('2d').putImageData(arrToImageData(tmp.getContext('2d'), arr, size, colormap), 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(tmp, 0, 0, canvas.width, canvas.height);
}

function renderTiledCanvas(canvas, arr, size, tiles, colormap) {
  const ctx = canvas.getContext('2d');
  const tmp = document.createElement('canvas');
  tmp.width = size; tmp.height = size;
  tmp.getContext('2d').putImageData(arrToImageData(tmp.getContext('2d'), arr, size, colormap), 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.imageSmoothingQuality = 'high';
  const cell = canvas.width / tiles;
  for (let ty = 0; ty < tiles; ty++)
    for (let tx = 0; tx < tiles; tx++)
      ctx.drawImage(tmp, tx*cell, ty*cell, cell, cell);
}

function renderRgbaToCanvas(canvas, rgba, size) {
  const ctx = canvas.getContext('2d');
  const tmp = document.createElement('canvas');
  tmp.width = size; tmp.height = size;
  const id = tmp.getContext('2d').createImageData(size, size);
  id.data.set(rgba);
  tmp.getContext('2d').putImageData(id, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(tmp, 0, 0, canvas.width, canvas.height);
}

// ============================================================
// Flow Map particle animation
// ============================================================
const N_PARTICLES = 600;
let _flowTimer = null;

function stopFlowAnim() {
  if (_flowTimer) { clearInterval(_flowTimer); _flowTimer = null; }
}

function startFlowAnim(cx, cy, fieldSize) {
  stopFlowAnim();
  const canvas = document.getElementById('flow-canvas');
  const S = canvas.width;
  const ctx = canvas.getContext('2d');
  const LIFETIME = 100, dt = 0.006;
  const px = new Float32Array(N_PARTICLES), py = new Float32Array(N_PARTICLES);
  const ages = new Float32Array(N_PARTICLES);
  for (let i = 0; i < N_PARTICLES; i++) { px[i] = Math.random(); py[i] = Math.random(); ages[i] = Math.random()*80; }
  let buf = new Float32Array(S*S*3);
  for (let i = 0; i < S*S; i++) { buf[i*3]=30; buf[i*3+1]=30; buf[i*3+2]=46; }

  _flowTimer = setInterval(() => {
    // sample + move
    for (let i = 0; i < N_PARTICLES; i++) {
      const ix = Math.floor(px[i]*fieldSize) % fieldSize;
      const iy = Math.floor(py[i]*fieldSize) % fieldSize;
      const vx = cx[iy*fieldSize+ix], vy = cy[iy*fieldSize+ix];
      px[i] = ((px[i]+vx*dt)%1+1)%1;
      py[i] = ((py[i]+vy*dt)%1+1)%1;
      ages[i]++;
      if (ages[i] > LIFETIME) { px[i]=Math.random(); py[i]=Math.random(); ages[i]=0; }
    }
    // fade buffer
    for (let i = 0; i < S*S; i++) {
      buf[i*3]   = buf[i*3]*0.88   + 30*0.12;
      buf[i*3+1] = buf[i*3+1]*0.88 + 30*0.12;
      buf[i*3+2] = buf[i*3+2]*0.88 + 46*0.12;
    }
    // paint particles
    for (let i = 0; i < N_PARTICLES; i++) {
      const alpha = Math.min(ages[i]/18, 1);
      if (alpha < 0.08) continue;
      const ix = Math.floor(px[i]*fieldSize) % fieldSize;
      const iy = Math.floor(py[i]*fieldSize) % fieldSize;
      const vx = cx[iy*fieldSize+ix], vy = cy[iy*fieldSize+ix];
      const sx = Math.floor(px[i]*S) % S, sy = Math.floor(py[i]*S) % S;
      const k = (sy*S+sx)*3;
      const r=(vx*0.5+0.5)*255*alpha, g=(vy*0.5+0.5)*255*alpha, b=alpha*210;
      if (r>buf[k])   buf[k]=r;
      if (g>buf[k+1]) buf[k+1]=g;
      if (b>buf[k+2]) buf[k+2]=b;
    }
    // write to canvas
    const id = ctx.createImageData(S, S);
    for (let i = 0; i < S*S; i++) {
      id.data[i*4]   = buf[i*3];
      id.data[i*4+1] = buf[i*3+1];
      id.data[i*4+2] = buf[i*3+2];
      id.data[i*4+3] = 255;
    }
    ctx.putImageData(id, 0, 0);
  }, 33);
}

function arrToExportCanvas(arr, size, colormap) {
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  const id = ctx.createImageData(size, size);
  id.data.set(applyColormap(arr, colormap));
  ctx.putImageData(id, 0, 0);
  return canvas;
}

function rgbaToExportCanvas(rgba, size) {
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  const id = ctx.createImageData(size, size);
  id.data.set(rgba); ctx.putImageData(id, 0, 0);
  return canvas;
}

function canvasToBlob(canvas) {
  return new Promise(res => canvas.toBlob(res, 'image/png'));
}

function downloadBlob(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

        canvas = rgbaToExportCanvas(flowmapToRgba(cx, cy), p.size);
      } else {
        const arr = GENERATORS[p.type](p.size, p.octaves, p.seed, p.freqScale);
        const out = postprocess(arr, p.gamma, p.invert, p.brightness);
        canvas = arrToExportCanvas(out, p.size, p.colormap);
      }
      const blob = await canvasToBlob(canvas);
      downloadBlob(blob, name);
      setStatus(`✅ 已下載  ${name}`, 'var(--green)');
    } catch(e) {
      setStatus(`⚠ ${e.message}`, 'var(--red)');
    }

  }, 0);
}

// ============================================================
// Batch generate → ZIP
// ============================================================
async function batchGenerate() {
  if (isGenerating) return;
  const p = getParams();
  const types = p.allTypes ? Object.keys(GENERATORS) : [p.type];
  const total = types.length * p.count;
  let done = 0;
  isGenerating = true;

  const useJSZip = typeof JSZip !== 'undefined';
  const zip = useJSZip ? new JSZip() : null;

  setStatus(`批次生成中… 0/${total}`, 'var(--blue)');
  setProgress(0);

  for (const type of types) {
    for (let i = 0; i < p.count; i++) {
      const seed = p.seed + i;
      const name = `${type}_${p.size}_${String(seed).padStart(4,'0')}.png`;
      setStatus(`生成中… ${done+1}/${total}  ${name}`, 'var(--blue)');
      setProgress(done / total * 100);

      await new Promise(r => setTimeout(r, 0)); // yield to browser

      try {
        let canvas;
        if (type === 'flowmap') {
          const { cx, cy } = generateFlowmapField(p.size, p.octaves, seed, p.freqScale);
          canvas = rgbaToExportCanvas(flowmapToRgba(cx, cy), p.size);
        } else {
          const arr = GENERATORS[type](p.size, p.octaves, seed, p.freqScale);
          const cm = type === 'energy' ? 'gold' : p.colormap;
          const out = postprocess(arr, p.gamma, p.invert, p.brightness);
          canvas = arrToExportCanvas(out, p.size, cm);
        }

        if (zip) {
          const blob = await canvasToBlob(canvas);
          zip.file(name, blob);
        } else {
          const blob = await canvasToBlob(canvas);
          downloadBlob(blob, name);
        }
      } catch(e) {
        console.error(`Error ${name}:`, e);
      }
      done++;
    }
  }

  setProgress(100);

  if (zip) {
    setStatus('壓縮中…', 'var(--blue)');
    await new Promise(r => setTimeout(r, 0));
    const blob = await zip.generateAsync({ type:'blob', compression:'DEFLATE', compressionOptions:{level:6} },
      meta => setProgress(meta.percent));
    const zipName = `NoiseGen_batch_${p.size}_${total}textures.zip`;
    downloadBlob(blob, zipName);
    setStatus(`✅ 完成！${total} 張  →  ${zipName}`, 'var(--green)');
  } else {
    setStatus(`✅ 完成！共 ${total} 張（已逐一下載）`, 'var(--green)');
  }

  setProgress(0);
  isGenerating = false;
}

// Dissolve preview — threshold 模擬 shader 溶解
// ============================================================
function renderDissolve() {
  if (!lastOut) return;
  const canvas = document.getElementById('dissolve-canvas');
  const t = parseInt(document.getElementById('dissolve-t').value) / 100;
  const edge = 0.06;
  const n = PREVIEW_CALC;
  const off = document.createElement('canvas');
  off.width = n; off.height = n;
  const ctx = off.getContext('2d');
  const id = ctx.createImageData(n, n);
  const d = id.data;
  for (let i = 0; i < n * n; i++) {
    const v = lastOut[i];
    const o = i * 4;
    if (v < t) {
      d[o] = 12; d[o+1] = 12; d[o+2] = 14; d[o+3] = 255;          // 已溶解：深底
    } else if (v < t + edge) {
      d[o] = 255; d[o+1] = 255; d[o+2] = 255; d[o+3] = 255;       // 溶解邊緣：白色發光帶
    } else {
      const g = 150 + ((v - t) * 70) | 0;                          // 本體：亮灰
      d[o] = g; d[o+1] = g; d[o+2] = g; d[o+3] = 255;
    }
  }
  ctx.putImageData(id, 0, 0);
  const dctx = canvas.getContext('2d');
  dctx.imageSmoothingEnabled = true;
  dctx.drawImage(off, 0, 0, canvas.width, canvas.height);
}

// ============================================================
// UV scroll preview — 模擬 shader 內貼圖滾動
// ============================================================
let scrollSrc = null;        // offscreen canvas holding current texture
let scrollRAF = null;
let scrollOff = 0;
let scrollLast = 0;

function updateScrollSource(out, colormap) {
  const n = PREVIEW_CALC;
  if (!scrollSrc) { scrollSrc = document.createElement('canvas'); scrollSrc.width = n; scrollSrc.height = n; }
  const ctx = scrollSrc.getContext('2d');
  const id = ctx.createImageData(n, n);
  id.data.set(applyColormap(out, colormap));
  ctx.putImageData(id, 0, 0);
  startScrollAnim();
}

function scrollFrame(ts) {
  scrollRAF = requestAnimationFrame(scrollFrame);
  if (!scrollSrc) return;
  const canvas = document.getElementById('scroll-canvas');
  const w = canvas.width;
  if (!w) return;
  const dt = scrollLast ? (ts - scrollLast) / 1000 : 0;
  scrollLast = ts;
  const speed = parseInt(document.getElementById('scroll-speed').value) / 10;
  scrollOff = (scrollOff + dt * speed * w * 0.25) % w;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  const ox = scrollOff, oy = scrollOff * 0.5 % w;
  ctx.drawImage(scrollSrc, ox - w, oy - w, w, w);
  ctx.drawImage(scrollSrc, ox,     oy - w, w, w);
  ctx.drawImage(scrollSrc, ox - w, oy,     w, w);
  ctx.drawImage(scrollSrc, ox,     oy,     w, w);
}

function startScrollAnim() {
  if (scrollRAF === null) { scrollLast = 0; scrollRAF = requestAnimationFrame(scrollFrame); }
}
function stopScrollAnim() {
  if (scrollRAF !== null) { cancelAnimationFrame(scrollRAF); scrollRAF = null; }
}

// ============================================================
// URL params — 分享與還原
// ============================================================
function shareURL() {
  const p = getParams();
  const q = new URLSearchParams({
    type: p.type, seed: p.seed, oct: p.octaves,
    zoom: document.getElementById('zoom').value,
    size: p.size, cmap: p.colormap,
    gamma: document.getElementById('gamma').value,
    bright: document.getElementById('bright').value,
    inv: p.invert ? 1 : 0,
  });
  const url = location.origin + location.pathname + '?' + q.toString();
  const done = () => setStatus('🔗 已複製分享連結', 'var(--green)');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(done).catch(() => fallbackCopy(url, done));
  } else {
    fallbackCopy(url, done);
  }
}

function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'absolute'; ta.style.left = '-9999px';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); }
  catch(e) { setStatus('⚠ 複製失敗，請手動複製網址', 'var(--red)'); }
  document.body.removeChild(ta);
}

function applyParamsFromURL() {
  const q = new URLSearchParams(location.search);
  if (![...q.keys()].length) return;
  const type = q.get('type');
  if (type && GENERATORS[type] !== undefined || type === 'flowmap') {
    currentType = type;
    document.querySelectorAll('#type-list li').forEach(li => li.classList.toggle('sel', li.dataset.key === type));
    const isFlow = type === 'flowmap';
    document.getElementById('tile-section').style.display = isFlow ? 'none' : '';
    document.getElementById('dissolve-section').style.display = isFlow ? 'none' : '';
    document.getElementById('scroll-section').style.display = isFlow ? 'none' : '';
    document.getElementById('flow-section').style.display = isFlow ? '' : 'none';
  }
  if (q.get('seed'))  document.getElementById('seed').value = parseInt(q.get('seed')) || 42;
  if (q.get('oct')) {
    document.getElementById('octaves').value = q.get('oct');
    document.getElementById('octaves-val').textContent = q.get('oct');
  }
  if (q.get('zoom')) {
    document.getElementById('zoom').value = q.get('zoom');
    document.getElementById('zoom-val').textContent = (q.get('zoom')/4).toFixed(2)+'×';
  }
  if (q.get('size')) {
    const r = document.querySelector(`input[name=size][value="${q.get('size')}"]`);
    if (r) r.checked = true;
  }
  if (q.get('cmap')) {
    const r = document.querySelector(`input[name=cmap][value="${q.get('cmap')}"]`);
    if (r) r.checked = true;
  }
  if (q.get('gamma')) {
    document.getElementById('gamma').value = q.get('gamma');
    document.getElementById('gamma-val').textContent = (q.get('gamma')/10).toFixed(1)+'×';
  }
  if (q.get('bright')) {
    const v = parseInt(q.get('bright'));
    document.getElementById('bright').value = v;
    document.getElementById('bright-val').textContent = v===0?'0.0':(v>0?'+':'')+(v/10).toFixed(1);
  }
  if (q.get('inv') === '1') document.getElementById('invert').checked = true;
}

// ============================================================
// Resolution info display
// ============================================================
function updateResInfo() {
  const p = getParams();
  const el = document.getElementById('res-info');
  if (el) el.textContent = p.type + ' · ' + p.size + 'px · seed ' + p.seed;
}

// ============================================================
// Keyboard shortcuts
// ============================================================
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.code === 'Space') { e.preventDefault(); schedulePreview(); }
  if (e.key === 's' || e.key === 'S') saveSingle();
  if (e.key === 'r' || e.key === 'R') randomSeed();
});

// Dissolve / scroll slider listeners
document.getElementById('dissolve-t').addEventListener('input', e => {
  document.getElementById('dissolve-t-val').textContent = e.target.value + '%';
  renderDissolve();
});
document.getElementById('scroll-speed').addEventListener('input', e => {
  document.getElementById('scroll-speed-val').textContent = (e.target.value/10).toFixed(1)+'×';
});

// Init
// ============================================================
buildUI();
applyParamsFromURL();
syncCanvasSizes();
updateResInfo();
schedulePreview();
startScrollAnim();
</script>
</body>
</html>
